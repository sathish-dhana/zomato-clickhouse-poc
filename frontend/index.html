<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Logs Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <header class="border-bottom py-3 mb-4">
            <div class="d-flex align-items-center">
                <h1 class="fs-4 ms-3">Myntra Logs Viewer</h1>
                <span class="badge bg-success ms-2">POC</span>
            </div>
        </header>

        <div class="row">
            <!-- Left Sidebar: Filters -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Filters</h5>
                    </div>
                    <div class="card-body">
                        <form id="filter-form">
                            <div class="mb-3">
                                <label for="date-range" class="form-label">Date Range</label>
                                <input type="text" class="form-control" id="date-range" name="date-range">
                            </div>
                            <div class="mb-3">
                                <label for="environment" class="form-label">Environment</label>
                                <select class="form-select" id="environment" name="environment">
                                    <option value="">All Environments</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="search-term" class="form-label">Search Term</label>
                                <input type="text" class="form-control" id="search-term" name="search-term" placeholder="Search in messages">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Apply Filters</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Stats</h5>
                    </div>
                    <div class="card-body">
                        <h6>Logs by Environment</h6>
                        <div id="env-stats" class="mb-4"></div>

                        <h6>Logs by Day</h6>
                        <canvas id="logs-by-day" height="200"></canvas>
                    </div>
                </div>
            </div>

            <!-- Main Content Area: Logs Table -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Logs</h5>
                        <span id="log-count" class="badge bg-primary"></span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped">
                                <thead>
                                    <tr>
                                        <th>Timestamp</th>
                                        <th>Environment</th>
                                        <th>Container ID</th>
                                        <th>Message</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-table-body">
                                    <!-- Logs will be populated here -->
                                </tbody>
                            </table>
                        </div>
                        <div id="loading" class="text-center d-none">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p>Loading logs...</p>
                        </div>
                        <div id="no-logs" class="text-center d-none">
                            <p class="mb-0">No logs found matching the criteria.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Log Details Modal -->
    <div class="modal fade" id="log-details-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Log Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="log-details-content"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
